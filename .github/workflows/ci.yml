name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (ubuntu-latest, node 22.12.0)
    runs-on: ubuntu-latest
    # A job that hangs is stopped here, rather than at GitHub's six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The engines floor, pinned exactly so npm ci's prepare build and
          # the suite run on it.
          node-version: '22.12.0'

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # On Node 22, each test file runs in a process of its own instead of
      # through node --test, whose parent can hang there for good:
      # scripts/test-each-file.sh says why.
      - name: Test (each file in its own process)
        run: bash scripts/test-each-file.sh

  install-and-start:
    name: Install & start (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Both platforms: a package-lock.json regenerated over an existing
      # node_modules tree records only that machine's native binaries, so a
      # lock made on macOS breaks Linux installs and vice versa. Each runner
      # catches the lock the other's platform produced.
      # Node: the engines floor and the newest Node the range admits; the floor
      # on Linux is build-and-test's.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', latest]
        exclude:
          - os: ubuntu-latest
            node: '22.12.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the package and import it
        working-directory: ${{ runner.temp }}
        run: |
          mkdir consumer
          cd consumer
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/animalabs-context-manager-*.tgz
          node --input-type=module -e "await import('@animalabs/context-manager')"
