name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Both platforms: a package-lock.json regenerated over an existing
      # node_modules tree records only that machine's native binaries, so a
      # lock made on macOS breaks Linux installs and vice versa. Each runner
      # catches the lock the other's platform produced.
      # Node: the engines floor, pinned exactly so npm ci's prepare build and
      # the suite run on it; the newest Node the range admits; and, between
      # them, every maintained major line (24), since each major ships its own
      # built-in fetch (Undici). The middle legs change when a line between
      # the ends reaches end of life, and when a new major becomes the newest
      # and the line it replaces falls between the ends. stdio
      # flushing around process exit differs between versions and platforms.
      # macOS runs the two ends only.
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.12.0', 24, latest]
        exclude:
          - os: macos-latest
            node: 24

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      # npm ci installs the lock verbatim: npm >= 11 'npm install' silently
      # re-resolves platform packages missing from the lock, so only npm ci
      # fails loudly on a broken or out-of-sync lockfile.
      - name: Install dependencies (strict lockfile)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Tests run on both platforms: process/stdio behaviour differs (pipes
      # are asynchronous on macOS), and ubuntu-only runs have missed that.
      - name: Test
        run: npm test
